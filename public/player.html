<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title.player">Offline Kahoot — Join</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/host.css" />
  </head>
  <!-- Full bright-Kahoot reskin (this task supersedes the old "player stays
       plain" decision): /play opts into .bg-kahoot for the purple field +
       white chunky shells from host.css/tokens.css. -->
  <body class="bg-kahoot">
    <main class="card" id="entering">
      <h1 data-i18n="player.joinTitle">Join the game</h1>

      <p id="status" class="status" role="status"></p>

      <p class="label"><label for="pin" data-i18n="player.pinLabel">Game PIN</label></p>
      <p>
        <input
          id="pin"
          class="player-input"
          inputmode="numeric"
          autocomplete="off"
          maxlength="6"
          placeholder="000000"
          data-i18n-attr="placeholder:player.pinPlaceholder"
        />
      </p>

      <p class="label"><label for="name" data-i18n="player.nameLabel">Nickname</label></p>
      <p>
        <input
          id="name"
          class="player-input"
          autocomplete="off"
          maxlength="20"
          placeholder="Nickname"
          data-i18n-attr="placeholder:player.namePlaceholder"
        />
      </p>

      <p class="label"><span data-i18n="player.colorLabel">Avatar color</span></p>
      <p
        id="color-picker"
        class="color-picker"
        role="radiogroup"
        aria-label="Avatar color"
        data-i18n-attr="aria-label:player.colorLabel"
      ></p>

      <p>
        <button id="join" class="player-button" data-i18n="player.join">Join</button>
      </p>
    </main>

    <main class="card" id="lobby" hidden>
      <h1 data-i18n="player.inTitle">You're in!</h1>
      <p class="label" data-i18n="player.playingAs">Playing as</p>
      <p id="final-name" class="player-name avatar-row"></p>
      <p id="waiting" class="status" role="status" data-i18n="player.waiting">
        Waiting for the host to start…
      </p>
      <p><button id="leave" class="player-button secondary" data-i18n="player.leave">Leave</button></p>
      <p class="label">
        <span data-i18n="player.players">Players</span>
        <span id="lobby-count"></span>
      </p>
      <ul id="lobby-players" class="players" data-i18n-attr="aria-label:player.players"></ul>
    </main>

    <main class="card" id="question" hidden>
      <p class="label">
        <span data-i18n="word.question">Question</span>
        <span id="question-number"></span>
      </p>
      <h1 id="question-prompt"></h1>
      <ol id="options" class="answers"></ol>
      <p
        id="countdown"
        class="countdown"
        aria-label="Seconds left"
        data-i18n-attr="aria-label:host.timeLeft"
      ></p>
      <p id="answer-status" class="status" role="status"></p>
    </main>

    <main class="card" id="reveal" hidden>
      <h1 id="result-title"></h1>
      <p id="result-points" class="result-points"></p>
      <p id="correct-answer" class="label"></p>
    </main>

    <main class="card" id="leaderboard" hidden>
      <h1 data-i18n="player.leaderboard">Leaderboard</h1>
      <p id="rank-leaderboard" class="rank-line"></p>
      <p id="score-leaderboard" class="avatar-row"></p>
      <p class="status" role="status" data-i18n="player.nextComing">Next question coming up…</p>
    </main>

    <main class="card" id="podium" hidden>
      <h1 data-i18n="player.gameOver">🏆 Game over!</h1>
      <p id="rank-podium" class="rank-line"></p>
      <p id="score-podium" class="avatar-row"></p>
    </main>

    <!-- i18n.js must load first: the pages' modules use its global API. -->
    <script src="/i18n.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/player.js" type="module"></script>
  </body>
</html>
