<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline Kahoot — Host</title>
    <link rel="stylesheet" href="/host.css" />
  </head>
  <body>
    <main class="card" id="view-lobby">
      <h1>Join the game</h1>

      <p id="status" class="status">starting…</p>

      <p class="label">Join URL</p>
      <p><a id="join-url" class="join-url" href="#"></a></p>

      <p class="label">PIN</p>
      <p id="pin" class="pin"></p>

      <p class="label">Scan to join</p>
      <img id="qr" class="qr" alt="QR code with the join URL" hidden />

      <p class="label">Players <span id="player-count"></span></p>
      <ul id="players" class="players"></ul>

      <p class="label">Quiz</p>
      <p>
        <select id="quiz-select" class="quiz-select">
          <option value="" disabled selected>Choose a quiz…</option>
        </select>
      </p>
      <p id="quiz-status" class="status"></p>
      <p>
        <a id="quiz-export" href="#" download hidden>Export selected quiz</a>
        <label for="quiz-import" class="label-inline">Import quiz</label>
        <input type="file" id="quiz-import" accept=".json,application/json" hidden />
      </p>

      <button id="start" class="player-button" disabled>Start game</button>
    </main>

    <main class="card" id="view-question" hidden>
      <p class="label"><span id="quiz-title"></span> — Question <span id="question-number"></span></p>
      <h1 id="question-prompt"></h1>
      <ol id="question-options" class="answers"></ol>
      <p class="label">Time left</p>
      <p id="countdown" class="countdown"></p>
      <button id="reveal" class="player-button">Reveal answer</button>
    </main>

    <main class="card" id="view-reveal" hidden>
      <h1>Correct answer</h1>
      <p id="correct-answer" class="pin"></p>
      <p class="label">Answered correctly</p>
      <ul id="correct-players" class="players"></ul>
      <button id="next" class="player-button">Next</button>
    </main>

    <main class="card" id="view-leaderboard" hidden>
      <h1>Leaderboard</h1>
      <ol id="leaderboard" class="players"></ol>
      <button id="leaderboard-next" class="player-button">Next question</button>
    </main>

    <main class="card" id="view-podium" hidden>
      <h1>🏆 Podium</h1>
      <ol id="podium" class="players"></ol>
      <button id="end-game" class="player-button">Back to lobby</button>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/host.js" type="module"></script>
  </body>
</html>
