<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title.host">Offline Kahoot — Host</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/host.css" />
  </head>
  <!-- page-host scopes the big-stage phase styling in host.css to this
       projector page (player.html shares host.css and must not get it). -->
  <body class="bg-kahoot page-host">
    <main class="card card-wide" id="view-lobby">
      <header class="card-head">
        <a href="/" class="back-link" data-i18n="host.dashboard">‹ Dashboard</a>
        <h1 data-i18n="host.join">Join the game</h1>
        <p id="status" class="status" role="status">starting…</p>
      </header>

      <div class="lobby-grid">
        <section class="panel" aria-label="Join details" data-i18n-attr="aria-label:host.join">
          <p class="label" data-i18n="host.joinUrl">Join URL</p>
          <p><a id="join-url" class="join-url" href="#"></a></p>

          <p class="label" data-i18n="host.pin">PIN</p>
          <p id="pin" class="pin"></p>

          <p class="label" data-i18n="host.scan">Scan to join</p>
          <img
            id="qr"
            class="qr"
            alt="QR code with the join URL"
            data-i18n-attr="alt:host.qrAlt"
            hidden
          />
        </section>

        <section class="panel">
          <p class="label">
            <span data-i18n="host.players">Players</span>
            <span id="player-count"></span>
          </p>
          <ul id="players" class="players" data-i18n-attr="aria-label:player.players"></ul>
          <p id="players-empty" class="empty" hidden data-i18n="host.lobbyEmpty">
            Waiting for players to join — share the PIN or the QR code.
          </p>

          <!-- Quiz selection moved to the dashboard cards (issue 04); the
               lobby shows the loaded quiz and the final start control. -->
          <p class="label" data-i18n="host.quiz">Quiz</p>
          <p id="quiz-name" class="quiz-name">&nbsp;</p>

          <button id="start" class="player-button" disabled data-i18n="host.startGame">
            Start game
          </button>
        </section>
      </div>
    </main>

    <!-- Big-stage question screen (host-big): the countdown lives in a slim
         top bar above the question (never obstructing it), next to the live
         Answered X/Y indicator; the question + 2x2 toast answer grid fill the
         viewport below. -->
    <main class="card card-stage" id="view-question" hidden>
      <div class="question-topbar">
        <p class="topbar-meta">
          <span id="quiz-title"></span> —
          <span data-i18n="word.question">Question</span>
          <span id="question-number"></span>
        </p>
        <div class="countdown-pill">
          <span id="countdown" class="countdown" role="status" aria-label="Seconds left"
                data-i18n-attr="aria-label:host.timeLeft"></span>
          <!-- Timer progress bar: drains with the countdown (fed by host.js
               via scaleX; aria-hidden because the digits carry the value). -->
          <div class="progress progress-timer" aria-hidden="true">
            <div id="timer-bar" class="progress-fill"></div>
          </div>
        </div>
        <p id="answered-indicator" class="answered-pill" role="status" data-i18n="host.answered">Answered</p>
      </div>
      <h1 id="question-prompt"></h1>
      <ol id="question-options" class="answers"></ol>
      <button id="reveal" class="player-button" data-i18n="host.reveal">Reveal answer</button>
    </main>

    <main class="card card-stage" id="view-reveal" hidden>
      <h1 data-i18n="host.correctAnswer">Correct answer</h1>
      <p id="correct-answer" class="correct-answer"></p>
      <!-- Answered meter (client-only): filled from the reveal payload's
           per-player results (X of the roster answered; bar + count). -->
      <p class="label" data-i18n="host.answered">Answered</p>
      <div class="progress" aria-hidden="true">
        <div id="answered-bar" class="progress-fill meter-answered"></div>
      </div>
      <p id="answered-count" class="meter-count" role="status"></p>
      <p class="label" data-i18n="host.answeredCorrectly">Answered correctly</p>
      <ul id="correct-players" class="players" data-i18n-attr="aria-label:host.answeredCorrectly"></ul>
      <button id="next" class="player-button" data-i18n="host.next">Next</button>
    </main>

    <main class="card card-stage" id="view-leaderboard" hidden>
      <h1 data-i18n="host.leaderboard">Leaderboard</h1>
      <ol id="leaderboard" class="players" data-i18n-attr="aria-label:host.leaderboard"></ol>
      <button id="leaderboard-next" class="player-button" data-i18n="host.nextQuestion">
        Next question
      </button>
    </main>

    <main class="card card-stage" id="view-podium" hidden>
      <h1 data-i18n="host.podium">🏆 Podium</h1>
      <ol id="podium" class="players" data-i18n-attr="aria-label:host.podium"></ol>
      <!-- Click-reveal: hidden/disabled until 1st place is up (host.js
           renderPodium unlocks it once the synced step is complete). -->
      <button id="end-game" class="player-button" data-i18n="host.backToLobby" hidden>
        Back to dashboard
      </button>
    </main>

    <!-- i18n.js must load first: the pages' modules use its global API. -->
    <script src="/i18n.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/host.js" type="module"></script>
  </body>
</html>
